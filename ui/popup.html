<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Redirector</title>
		<link rel="stylesheet" href="../css/popup.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
	</head>
	<body>
		<h1><picture class="brand-icon">
			<source srcset="../images/icon-dark-theme-32.png" media="(prefers-color-scheme: dark)">
			<img src="../images/icon-light-theme-32.png" alt="">
		</picture>Redirector</h1>
		<div class="disabled"><span data-show="disabled" style="display:none">Disabled</span></div>
		<button id="toggle-disabled" data-class="is-disabled:disabled"><span data-show="disabled" style="display:none">Enable Redirector</span><span data-show="!disabled">Disable Redirector</span></button>
        <button id="open-redirector-settings">Edit Redirects</button>
		<label><input id="enable-logging" type="checkbox" data-bind="logging" /> <span>Enable logging</span></label>
		<label><input id="enable-notifications" type="checkbox" data-bind="enableNotifications" /> <span>Enable notifications</span></label>
		<label><input id="enable-post" type="checkbox" data-bind="enablePost" /> <span>Enable POST redirects</span></label>
		<script src="../js/stub.js"></script>
		<script src="../js/util.js"></script>
		<script src="../js/popup.js"></script>
	</body>
</html>
